<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaking and Reading: Read Aloud</title>
  <style>
    :root {
      --primary-teal: #00877c;
      --border-gray: #d0d5dd;
      --text-dark: #1f2937;
      --accent-red: #d92d20;
      --accent-blue: #0284c7;
      --accent-green: #15803d;
      --bg-slate: #f8fafc;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; padding: 2rem 1rem; display: flex; justify-content: center; }

    .test-card {
      background: #ffffff;
      width: 100%;
      max-width: 820px;
      border: 1px solid var(--border-gray);
      border-radius: 8px;
      padding: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .benchmark-tag {
      background-color: var(--primary-teal);
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 0.35rem 0.8rem;
      display: inline-block;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .main-title {
      font-size: 2.2rem;
      color: var(--primary-teal);
      font-family: Georgia, serif;
      font-style: italic;
      margin: 0 0 1rem 0;
    }
    .main-title strong { font-style: normal; font-weight: 700; }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      color: #64748b;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }

    .instructions {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-dark);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .recorder-box {
      border: 2px solid #94a3b8;
      background: var(--bg-slate);
      border-radius: 6px;
      width: 380px;
      margin: 0 auto 1.5rem auto;
      text-align: center;
      padding: 1.25rem 1rem;
      transition: all 0.3s ease;
    }

    .recorder-box.active-prep {
      border-color: var(--primary-teal);
      background: #f0fdf4;
    }

    .recorder-box.active-rec {
      border-color: var(--accent-red);
      background: #fef2f2;
      box-shadow: 0 0 12px rgba(217, 45, 32, 0.2);
    }

    .status-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .status-message {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
      min-height: 1.5rem;
      margin-bottom: 1rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border: 1px solid #94a3b8;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-teal);
      transition: width 0.3s linear;
    }

    .prompt-text {
      font-size: 1.2rem;
      line-height: 1.85;
      color: #334155;
      border-top: 1px solid #e2e8f0;
      padding-top: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button {
      background: var(--primary-teal);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-secondary { background: #475569; }
    .btn-record { background: var(--accent-blue); display: none; }
    .btn-stop { background: var(--accent-red); display: none; }

    .audio-comparison {
      margin-top: 1.5rem;
      background: var(--bg-slate);
      padding: 1.2rem;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .audio-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .audio-row span { font-weight: 600; font-size: 0.95rem; color: #475569; width: 170px; }
    .audio-row audio { width: 100%; max-width: 480px; }

    .feedback-panel {
      display: none;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 2px solid #e2e8f0;
    }

    .score-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .word-correct { color: var(--accent-green); font-weight: 700; }
    .word-missed { color: var(--accent-red); text-decoration: line-through; margin-right: 2px; }

    .heard-box {
      background: #f1f5f9;
      border-left: 4px solid var(--primary-teal);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: #334155;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="test-card">
    <div class="benchmark-tag">Benchmark Test Question Types</div>
    <div class="main-title"><strong>Speaking and Reading:</strong> Read Aloud</div>

    <div class="meta-bar">
      <span id="counterLabel">Question 1 of 10</span>
      <span id="levelLabel">Level: B1</span>
    </div>

    <div class="instructions">
      1. Click <strong>"Start Preparation (25s)"</strong> to read silently.<br>
      2. When ready
